# Build desktop packages on pull requests and main pushes.
# Uploads preview artifacts only; does not create GitHub Releases.
# Skips preview builds on main when the Release workflow will publish instead.
# Windows/Linux previews upload the application folder directly so downloads
# need one extract, matching GitHub Release assets instead of zip-in-zip.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check if preview build is needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether CI should skip for an upcoming release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Non-push event; running preview build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_version() {
            python3 -c "import tomllib,sys; print(tomllib.load(sys.stdin.buffer)['project']['version'])"
          }

          version="$(read_version < pyproject.toml)"
          tag="v${version}"

          previous=""
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BEFORE_SHA}:pyproject.toml" 2>/dev/null; then
            previous="$(git show "${BEFORE_SHA}:pyproject.toml" | read_version)"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            previous="$(git show HEAD^:pyproject.toml | read_version)"
          fi

          if [[ -n "${previous}" && "${previous}" == "${version}" ]]; then
            echo "Version ${version} unchanged; running preview build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version changed in push: ${previous:-unknown} -> ${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; running preview build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! awk -v ver="${version}" '
            $0 ~ "^## \\[" ver "(\\]| -)" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "No CHANGELOG section for ${version}; Release will fail, running preview build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release ${tag} will run; skipping preview build."
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  build:
    name: Preview build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: macos-intel
          - os: macos-15
            target: macos-arm
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxi6

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"

      - name: Install project dependencies
        run: poetry install --with dev

      - name: Build package
        run: poetry run build ${{ matrix.target }}

      - name: Prepare preview upload
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            windows)
              unzip -q dist/Starflight-*.zip -d dist/preview-upload
              echo "path=dist/preview-upload/Starflight" >> "$GITHUB_OUTPUT"
              ;;
            linux)
              mkdir -p dist/preview-upload
              tar -xzf dist/Starflight-*.tar.gz -C dist/preview-upload
              echo "path=dist/preview-upload/Starflight" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "path=dist/Starflight-*.dmg" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: starflight-${{ matrix.target }}-preview
          path: ${{ steps.preview.outputs.path }}
          if-no-files-found: error
          retention-days: 14
